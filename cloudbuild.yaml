steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/yasmin-ai:$COMMIT_SHA', '.']

  # 2. Push the container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/yasmin-ai:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yasmin-ai-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yasmin-ai:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '1Gi'

images:
  - 'gcr.io/$PROJECT_ID/yasmin-ai:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
